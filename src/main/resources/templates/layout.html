<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="site-head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Image Hoster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/site.css}"/>
</head>

<body>

<header th:fragment="logged-out" class="site-header">
    <a class="brand" th:href="@{/}">Image Hoster</a>
    <nav class="nav">
        <a th:href="@{/users/login}">Login</a>
        <a th:href="@{/users/registration}">Register</a>
    </nav>
</header>

<header th:fragment="logged-in" class="site-header">
    <a class="brand" th:href="@{/images}">Image Hoster</a>
    <nav class="nav">
        <span class="user-label" th:text="${session.loggeduser.profile.fullName}">User</span>
        <a th:href="@{/images/upload}">Upload</a>
        <form method="post" th:action="@{/users/logout}">
            <input type="submit" value="Logout"/>
        </form>
    </nav>
</header>

</body>
</html>
