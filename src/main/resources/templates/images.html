<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: site-head"></head>
<body>
<header th:replace="layout :: logged-in"></header>

<main class="page">
    <h1 class="page-title">Gallery</h1>
    <p class="page-lead">Your images.</p>

    <section class="gallery" th:if="${!#lists.isEmpty(images)}">
        <article class="gallery-item" th:each="i : ${images}">
            <a th:href="'/images/' + ${i.title}">
                <img th:src="'data:image/jpeg;base64,' + ${i.imageFile}" th:alt="${i.title}"/>
                <h3 th:text="${i.title}">Title</h3>
            </a>
            <p class="meta" th:text="${#dates.format(i.date, 'd MMM yyyy')}">Date</p>
        </article>
    </section>
    <p class="empty" th:if="${#lists.isEmpty(images)}">No images yet. <a th:href="@{/images/upload}">Upload one</a>.</p>
</main>
</body>
</html>
