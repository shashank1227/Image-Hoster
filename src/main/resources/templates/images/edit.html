<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: site-head"></head>
<body>
<header th:replace="layout :: logged-in"></header>

<main class="page">
    <h1 class="page-title">Edit</h1>
    <p class="page-lead">Update this image.</p>

    <form class="form" th:method="put" th:action="@{/editImage(imageId=${image.id})}" enctype="multipart/form-data">
        <label>
            Title
            <input type="text" name="title" th:value="${image.title}" required="required"/>
        </label>
        <label>
            Description
            <textarea name="description" th:text="${image.description}"></textarea>
        </label>
        <label>
            Replace file
            <input type="file" name="file" id="file"/>
        </label>
        <label>
            Tags
            <textarea name="tags" id="tags" th:text="${tags}"></textarea>
        </label>
        <p class="hint">Separate tags with commas.</p>
        <input type="submit" value="Save"/>
    </form>
</main>
</body>
</html>
