<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: site-head"></head>
<body>
<header th:replace="layout :: logged-in"></header>

<main class="page detail">
    <div class="detail-image">
        <img th:src="'data:image/jpeg;base64,' + ${image.imageFile}" th:alt="${image.title}"/>
    </div>
    <h1 class="detail-title" th:text="${image.title}">Title</h1>
    <p class="meta" th:text="${#dates.format(image.date, 'd MMM yyyy')}">Date</p>
    <p th:text="${image.description}">Description</p>
    <div class="tags" th:if="${tags != null and !#lists.isEmpty(tags)}">
        <span th:each="tag : ${tags}" th:text="${tag.name}">tag</span>
    </div>
    <div class="detail-actions">
        <a th:href="@{/editImage(imageId=${image.id})}">Edit</a>
        <form th:action="@{/deleteImage(imageId=${image.id})}" th:method="delete">
            <input class="btn-danger" type="submit" value="Delete"/>
        </form>
    </div>
</main>
</body>
</html>
