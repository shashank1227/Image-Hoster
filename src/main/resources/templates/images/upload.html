<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: site-head"></head>
<body>
<header th:replace="layout :: logged-in"></header>

<main class="page">
    <h1 class="page-title">Upload</h1>
    <p class="page-lead">Add a new image.</p>

    <form class="form" method="post" th:action="@{/images/upload}" enctype="multipart/form-data">
        <label>
            Title
            <input type="text" id="title" name="title" required="required"/>
        </label>
        <label>
            Description
            <textarea name="description"></textarea>
        </label>
        <label>
            File
            <input type="file" name="file" id="file" required="required"/>
        </label>
        <label>
            Tags
            <input type="text" name="tags" id="tags" placeholder="nature, portrait"/>
        </label>
        <p class="hint">Separate tags with commas.</p>
        <input type="submit" value="Upload"/>
    </form>
</main>
</body>
</html>
